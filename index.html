<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ếch Nhảy Qua Giếng</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0e1a2b;
    font-family: 'Trebuchet MS', sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #game-wrap {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    background: #7ec8e3;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    border-radius: 8px;
    cursor: pointer;
  }
  #hud {
    position: absolute; top: 16px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    color: #fff;
    font-weight: bold;
    font-size: 22px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  #hud button {
    pointer-events: auto;
    border: none;
    background: rgba(255,255,255,0.12);
    color: #fff;
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  #hud button:hover {
    background: rgba(255,255,255,0.2);
  }
  #overlay, #loading-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center;
    background: rgba(0,0,0,0.45);
    border-radius: 8px;
    pointer-events: none;
  }
  #overlay h1 { font-size: 40px; margin: 0 0 8px 0; text-shadow: 0 3px 6px rgba(0,0,0,0.6); }
  #overlay p { font-size: 18px; margin: 4px 0; opacity: 0.9; }
  #overlay .hint { font-size: 15px; opacity: 0.75; margin-top: 14px; }
  #loading-overlay { font-size: 22px; }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="900" height="500"></canvas>
  <div id="hud">
    <div id="score">Điểm: 0</div>
    <div id="best">Kỷ lục: 0</div>
    <button id="leaderboardBtn">Xếp hạng</button>
  </div>
  <div id="overlay">
    <h1>🐸 Ếch Nhảy Qua Giếng</h1>
    <p>Giữ chuột / chạm / phím Space để tích lực nhảy</p>
    <p class="hint">Nhấn hoặc chạm để bắt đầu</p>
  </div>
  <div id="loading-overlay">Đang khởi động...</div>
</div>

<script src="https://connect.facebook.net/en_US/fbinstant.6.0.js"></script>
<script src="game.js"></script>
</body>
</html>
